name: BuildReleaseApk test

on:
  workflow_dispatch:          # Nút chạy thủ công
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - master

jobs:
  buildReleaseApk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: "0"

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk || true
          docker system prune -af || true
          sudo rm -rf /usr/local/lib/android/sdk/system-images || true
          sudo rm -rf /usr/local/lib/android/sdk/emulator || true
          rm -rf ~/.gradle/caches/modules-2/files-2.1 || true
          rm -rf ~/.gradle/caches/build-cache || true
          rm -rf ~/.npm/_cacache ~/.cache || true
          sudo rm -rf /home/runner/work/_temp || true
          df -h

      - name: Specify node version
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Use specific Java version
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Use gradle caches
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle', 'android/**/*.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "platform-tools" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install node_modules
        run: npm ci --yes

      - name: Set up Ruby
        uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f # v1.306.0
        with:
          ruby-version: 3.4.9
          bundler-cache: true

      - name: Generate Build Number
        id: build_number
        run: |
          NEW_BUILD_NUMBER="$(date +%s)"
          echo "NEW_BUILD_NUMBER=$NEW_BUILD_NUMBER" >> $GITHUB_ENV
          echo "build_number=$NEW_BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: Decode keystore from BASE64
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

      - name: Build release APK with signing
        id: build_release_apk
        run: |
          cd android
          # Truyền tham số signing qua biến môi trường (Gradle đọc thành property)
          export ORG_GRADLE_PROJECT_KEYSTORE_FILE="keystore.jks"
          export ORG_GRADLE_PROJECT_KEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}"
          export ORG_GRADLE_PROJECT_KEY_ALIAS="${{ secrets.KEY_ALIAS }}"
          export ORG_GRADLE_PROJECT_KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
          ./gradlew assembleRelease
        env:
          BUILD_NUMBER: ${{ steps.build_number.outputs.build_number }}

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-build-logs
          path: |
            fastlane/logs/**/*.log
            android/**/*.log
            android/**/build/**/*.log
            android/**/outputs/logs/**/*.log
            android/**/reports/**/*.log
          if-no-files-found: warn

      # Debug: liệt kê file APK
      - name: List build outputs
        run: |
          find android -name "*.apk" -type f
          ls -la android/app/build/outputs/apk/ || true
          ls -la android/app/build/outputs/apk/release/ || true

      - name: Determine APK Filename and Path
        id: determine_apk_path
        run: |
          BUILD_NUMBER=${{ steps.build_number.outputs.build_number }}
          VERSION_NAME=$(grep versionName android/app/build.gradle | awk '{print $2}' | tr -d '"')
          BRANCH_NAME=${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}
          BRANCH_NAME=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9_-]/_/g')

          # Tìm APK đầu tiên trong thư mục release
          APK_SOURCE=$(find android/app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_SOURCE" ]; then
            # Nếu không có, thử tìm trong toàn bộ dự án
            APK_SOURCE=$(find android -name "*.apk" -type f | head -n 1)
          fi
          if [ -z "$APK_SOURCE" ]; then
            echo "ERROR: No APK found!"
            exit 1
          fi

          echo "Found APK at: $APK_SOURCE"

          if [ -n "$BRANCH_NAME" ] && [ "$BRANCH_NAME" != "master" ]; then
            EXPECTED_FILENAME="BlueWallet-Release-${VERSION_NAME}-${BUILD_NUMBER}-${BRANCH_NAME}.apk"
          else
            EXPECTED_FILENAME="BlueWallet-Release-${VERSION_NAME}-${BUILD_NUMBER}.apk"
          fi

          APK_DIR=$(dirname "$APK_SOURCE")
          APK_TARGET="${APK_DIR}/${EXPECTED_FILENAME}"
          mv "$APK_SOURCE" "$APK_TARGET"

          echo "EXPECTED_FILENAME=${EXPECTED_FILENAME}" >> $GITHUB_ENV
          echo "APK_PATH=${APK_TARGET}" >> $GITHUB_ENV

      - name: Upload APK as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

  browserstack:
    runs-on: macos-26
    needs: buildReleaseApk
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'browserstack') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Ruby
        uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f # v1.306.0
        with:
          ruby-version: 3.4.9
          bundler-cache: true

      - name: Install dependencies
        run: bundle install --jobs 4 --retry 3

      - name: Download APK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-apk

      - name: Set APK Path
        run: |
          APK_PATH=$(find ${{ github.workspace }} -name '*.apk')
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Upload APK to BrowserStack and Post PR Comment
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bundle exec fastlane upload_to_browserstack_and_comment